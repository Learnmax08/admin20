<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPlatform - Admin Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.cmwithmn.lk/web-data/Static/assets/bootstrap/css/bootstrap.min.css">
    <style>
        body {
            background-color: #0b0e14;
            color: #c9d1d9;
            font-family: sans-serif;
            padding-top: 50px;
        }
        .admin-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            padding: 30px;
        }
        .form-control {
            background-color: #0d1117 !important;
            border: 1px solid #30363d !important;
            color: #ffffff !important;
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus {
            border-color: #ff9100 !important;
            box-shadow: 0 0 10px rgba(255, 145, 0, 0.3) !important;
        }
        .btn-update-date {
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
        }
        .btn-update-link {
            background: linear-gradient(135deg, #ff9100, #ff3d00);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
        }
        .header-title {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="admin-card">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-gear fa-3x text-info mb-3"></i>
                        <h3 class="header-title">Nexus Live Hub Admin</h3>
                        <p class="text-muted small">ඔයාට ඕන කොටස විතරක් වෙන වෙනම වුණත් මෙතනින් අප්ඩේට් කරන්න පුළුවන්.</p>
                    </div>
                    
                    <div class="p-3 border border-secondary rounded mb-4" style="background: rgba(255,255,255,0.02);">
                        <label class="form-label fw-bold text-info"><i class="fa-solid fa-calendar-days me-2"></i>1. පන්තිය තියෙන දිනය (Class Date)</label>
                        <input type="text" id="class-date" class="form-control mb-3" placeholder="උදා: Next Monday at 7.30 PM">
                        <button id="btn-date" class="btn btn-update-date w-100">
                            <i class="fa-solid fa-calendar-check me-2"></i>දිනය විතරක් Update කරන්න
                        </button>
                    </div>

                    <div class="p-3 border border-secondary rounded" style="background: rgba(255,255,255,0.02);">
                        <h6 class="text-warning fw-bold mb-3"><i class="fa-solid fa-video me-2"></i>2. Zoom Credentials (ලින්ක් එක දาන වෙලාවට)</h6>
                        
                        <div class="mb-3">
                            <label class="form-label text-white small">Zoom Lecture Link</label>
                            <input type="url" id="zoom-link" class="form-control" placeholder="https://zoom.us/j/...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white small">පන්ති කාමරයේ රහස් පදය (Password)</label>
                            <input type="text" id="zoom-pass" class="form-control" placeholder="Unlock කරන්න දෙන Password එක">
                        </div>

                        <button id="btn-link" class="btn btn-update-link w-100">
                            <i class="fa-solid fa-key me-2"></i>Link & Password Update කරන්න
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, update, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        // Firebase Config විස්තර
        const firebaseConfig = {
            apiKey: "AIzaSyBNVWTQLCDd1cOOU-cOdepjXPuCwH2__dw",
            authDomain: "nexus-db7a5.firebaseapp.com",
            databaseURL: "https://nexus-db7a5-default-rtdb.firebaseio.com",
            projectId: "nexus-db7a5",
            storageBucket: "nexus-db7a5.firebasestorage.app",
            messagingSenderId: "599095336957",
            appId: "1:599095336957:web:aed6923cea8bb43d068394"
        };

        // Firebase Init කිරීම
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const classRef = ref(db, 'liveClass');

        // 📥 පේජ් එක ලෝඩ් වෙද්දී Firebase එකේ දැනට තියෙන දත්ත Textbox වලට ගැනීම
        document.addEventListener("DOMContentLoaded", function() {
            get(classRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if(data.date) document.getElementById('class-date').value = data.date;
                    if(data.link) document.getElementById('zoom-link').value = data.link;
                    if(data.password) document.getElementById('zoom-pass').value = data.password;
                }
            }).catch((error) => {
                console.error("දත්ත කියවීමේ ගැටලුවක්: ", error);
            });
        });

        // 📅 ෆන්ක්ෂන් 1: දිනය විතරක් අප්ඩේට් කිරීම
        function updateDateOnly() {
            const dateVal = document.getElementById('class-date').value;
            if(!dateVal) { alert("කරුණාකර දිනය ඇතුළත් කරන්න!"); return; }
            
            update(classRef, {
                date: dateVal
            }).then(() => {
                alert("📅 පන්තියේ දිනය සාර්ථකව Cloud එකට Update වුණා!");
            }).catch((error) => {
                alert("ගැටලුවක් පවතී: " + error.message);
            });
        }

        // 🔗 ෆන්ක්ෂන් 2: ලින්ක් එක සහ පස්වර්ඩ් එක අප්ඩේට් කිරීම
        function updateLinkAndPass() {
            const linkVal = document.getElementById('zoom-link').value;
            const passVal = document.getElementById('zoom-pass').value;

            if(!linkVal || !passVal) { alert("ලින්ක් එක සහ පස්වර්ඩ් එක දෙකම පුරවන්න!"); return; }

            update(classRef, {
                link: linkVal,
                password: passVal
            }).then(() => {
                alert("🔗 Zoom Link එක සහ Password එක සාර්ථකව Cloud එකට Update වුණා!");
            }).catch((error) => {
                alert("ගැටලුවක් පවතී: " + error.message);
            });
        }

        // බටන් වලට Click Events ලින්ක් කිරීම
        document.getElementById('btn-date').addEventListener('click', updateDateOnly);
        document.getElementById('btn-link').addEventListener('click', updateLinkAndPass);
    </script>
</body>
</html>
