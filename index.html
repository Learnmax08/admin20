<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 35px; border-radius: 16px; width: 90%; max-width: 450px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        button { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #0369a1; }
        #status { margin-top: 20px; font-size: 14px; font-weight: bold; color: #f59e0b; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.05); }
        .connected-viewers { margin-top: 10px; font-size: 13px; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Screen Streamer</h2>
        <p>Zoom, YouTube හෝ Screen එක Share කරන්න. <b>"Share system audio"</b> ටික් කිරීමට අමතක නොකරන්න.</p>
        <button id="startBtn" onclick="startBroadcasting()">Start Live Sharing</button>
        <div id="status">Status: Initializing Connection...</div>
        <div class="connected-viewers" id="viewerCount">Viewers Connected: 0</div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const STREAM_KEY = 'learnmax08-final-stable-key-2026';
        let peer = null;
        let localStream = null;
        let connectedCalls = new Set();

        function initPeer() {
            peer = new Peer(STREAM_KEY, {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', id => {
                document.getElementById('status').innerText = 'Status: Ready to Share! Click Start Button.';
                document.getElementById('status').style.color = '#38bdf8';
            });

            peer.on('call', call => {
                if (localStream) {
                    call.answer(localStream);
                    connectedCalls.add(call.peer);
                    updateViewerCount();

                    call.on('close', () => {
                        connectedCalls.delete(call.peer);
                        updateViewerCount();
                    });
                }
            });

            peer.on('error', err => {
                console.error('Peer Error:', err);
                if (err.type === 'unavailable-id') {
                    document.getElementById('status').innerText = 'Status: Reconnecting Key...';
                    setTimeout(initPeer, 2000);
                }
            });
        }

        function updateViewerCount() {
            document.getElementById('viewerCount').innerText = `Viewers Connected: ${connectedCalls.size}`;
        }

        function startBroadcasting() {
            navigator.mediaDevices.getDisplayMedia({ 
                video: { frameRate: 30 }, 
                audio: true 
            }).then(stream => {
                localStream = stream;
                
                const status = document.getElementById('status');
                status.innerText = 'Status: Live Stream Active!';
                status.style.color = '#22c55e';
                document.getElementById('startBtn').innerText = 'Sharing Active...';

                stream.getVideoTracks()[0].onended = () => {
                    status.innerText = 'Status: Stream Stopped';
                    status.style.color = '#ef4444';
                    document.getElementById('startBtn').innerText = 'Start Live Sharing';
                    localStream = null;
                };

            }).catch(err => {
                alert('Screen Share Error: ' + err.message);
            });
        }

        initPeer();
    </script>
</body>
</html>
