<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Stream Offline UI */
        .offline-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            z-index: 1;
            position: absolute;
        }

        .pulse-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
            animation: pulse 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
        }

        .pulse-dot {
            width: 20px;
            height: 20px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 15px #38bdf8;
        }

        @keyframes pulse {
            to { box-shadow: 0 0 0 40px rgba(56, 189, 248, 0); }
        }

        .offline-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .offline-subtitle {
            font-size: 13px;
            color: #64748b;
        }

        /* Clean Fullscreen Video Player */
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* Sound Unmute Notification Overlay */
        .unmute-notice {
            position: absolute;
            top: 20px;
            background: rgba(0,0,0,0.8);
            color: #38bdf8;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            z-index: 3;
            border: 1px solid #38bdf8;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="unmute-notice" id="soundNotice">🔊 Click anywhere on screen for sound</div>

    <!-- Offline Animation Panel -->
    <div class="offline-box" id="offlineUI">
        <div class="pulse-ring">
            <div class="pulse-dot"></div>
        </div>
        <div class="offline-title">Waiting for Live Class...</div>
        <div class="offline-subtitle">The stream will appear automatically when admin starts sharing.</div>
    </div>

    <!-- Pure Video Component -->
    <video id="remoteVideo" autoplay playsinline style="display: none;"></video>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer();
        const hostId = 'my-zoom-class-master-stream';
        let isConnected = false;

        peer.on('open', () => {
            connectToHost();
        });

        function connectToHost() {
            if (isConnected) return;

            const call = peer.call(hostId, null);

            call.on('stream', remoteStream => {
                isConnected = true;
                const videoEl = document.getElementById('remoteVideo');
                document.getElementById('offlineUI').style.display = 'none';
                videoEl.style.display = 'block';
                videoEl.srcObject = remoteStream;

                // Browser Autoplay restrict වුණොත් Sound එකට Screen එක Click කරන්න පණිවිඩය පෙන්වීම
                videoEl.play().catch(() => {
                    document.getElementById('soundNotice').style.display = 'block';
                });
            });

            call.on('close', resetToOffline);
            call.on('error', resetToOffline);
        }

        function resetToOffline() {
            isConnected = false;
            document.getElementById('remoteVideo').style.display = 'none';
            document.getElementById('offlineUI').style.display = 'flex';
            document.getElementById('soundNotice').style.display = 'none';
        }

        // Auto retry connecting if offline
        setInterval(() => {
            if (!isConnected && peer.open) {
                connectToHost();
            }
        }, 3000);

        // Click anywhere to enable audio if browser blocked autoplay
        document.body.addEventListener('click', () => {
            const videoEl = document.getElementById('remoteVideo');
            if (videoEl.srcObject) {
                videoEl.play();
                document.getElementById('soundNotice').style.display = 'none';
            }
        });
    </script>
</body>
</html>
