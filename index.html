<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Host Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
        }
        h2 { margin-bottom: 15px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background: #0369a1; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Class Control Panel</h2>
        <p>Zoom App එක Screen Share කිරීම සඳහා පහත Button එක ක්ලික් කරන්න. (Share System Audio ටික් එක On කිරීමට මතක තබාගන්න).</p>
        <button onclick="startSharing()">Start Sharing Zoom</button>
        <div id="status">Status: Offline (Not Sharing)</div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer;
        let localStream;

        function startSharing() {
            navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                document.getElementById('status').innerText = 'Status: Live & Sharing Active!';
                document.getElementById('status').style.color = '#22c55e';
                
                // Fixed Peer ID for the Room Connection
                peer = new Peer('my-secret-zoom-room-stream');

                peer.on('open', id => {
                    console.log('Stream ready:', id);
                });

                peer.on('call', call => {
                    call.answer(localStream);
                });

                // When user stops screen sharing from browser
                stream.getVideoTracks()[0].onended = () => {
                    document.getElementById('status').innerText = 'Status: Stream Stopped';
                    document.getElementById('status').style.color = '#ef4444';
                };

            }).catch(err => {
                alert('Screen Share Canceled or Failed: ' + err.message);
            });
        }
    </script>
</body>
</html>
